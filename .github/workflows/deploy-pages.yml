name: Deploy MODIVO to GitHub Pages
# Manual only: this workflow never deploys on push.
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the validated export to GitHub Pages
        type: boolean
        required: true
        default: false
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Export static website
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: ${{ steps.pages.outputs.base_url }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_CONTACT_EMAIL: modivo2026@gmail.com
          NEXT_PUBLIC_LEGAL_APPROVED: ${{ vars.LEGAL_APPROVED || 'false' }}
          NEXT_PUBLIC_SALES_ENABLED: ${{ vars.SALES_ENABLED || 'false' }}
          NEXT_PUBLIC_ANALYTICS_ENABLED: ${{ vars.ANALYTICS_ENABLED || 'false' }}
          NEXT_PUBLIC_ANALYTICS_REVIEWED: ${{ vars.ANALYTICS_REVIEWED || 'false' }}
          NEXT_PUBLIC_CLOUDFLARE_ANALYTICS_TOKEN: ${{ vars.CLOUDFLARE_ANALYTICS_TOKEN }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out
  deploy:
    if: ${{ inputs.deploy }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
